name: Deploy naar Strato

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installeer lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Maak deploy-map
        run: |
          mkdir -p deploy
          cp index.html deploy/
          cp indextest.html deploy/
          cp -R Website-De-Dames_5_images deploy/

      - name: Upload website via SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "sftp://$FTP_SERVER:22" <<EOF
          set net:max-retries 2
          set net:timeout 20
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          mirror --reverse --verbose --delete --exclude-glob .git* --exclude-glob .github --exclude-glob Oud deploy "/site"
          quit
          EOF
